[package]
name = "inbox-relay"
version = "0.1.0"
edition = "2024"
publish = false
description = "Encrypted phone-to-desktop inbox relay for Second Brain Workspace"
license = "MIT"

[dependencies]
axum = { version = "0.8.9", features = ["ws"] }
base64 = "0.23.1"
hex = "0.4.3"
reqwest = { version = "0.12.28", default-features = false, features = ["rustls-tls"] }
ring = "0.17.14"
rusqlite = { version = "0.40.2", features = ["bundled"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
tokio = { version = "1.54.1", features = ["rt-multi-thread", "macros", "net", "time", "sync", "signal"] }
tower-http = { version = "0.6.11", features = ["fs", "set-header"] }

[dev-dependencies]
futures-util = "0.3.34"
http-body-util = "0.1.5"
p256 = { version = "0.13.2", default-features = false, features = ["ecdh", "std"] }
tokio-tungstenite = "0.30.0"
tower = { version = "0.5.3", features = ["util"] }

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
strip = true
